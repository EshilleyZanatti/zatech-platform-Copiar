services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zatech
      POSTGRES_PASSWORD: zatech_dev_change_me
      POSTGRES_DB: zatech
    ports: ["5434:5432"]
    volumes: ["zatech_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
volumes:
  zatech_pg:
